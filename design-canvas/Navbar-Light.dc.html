<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap">
  <style>
    :root{
      --bg: oklch(97% 0.008 75);
      --surface: oklch(99% 0.003 75);
      --ink: oklch(20% 0.02 75);
      --muted: oklch(48% 0.015 75);
      --border: oklch(89% 0.01 75);
      --accent: oklch(62% 0.16 45);
      --accent-dark: oklch(52% 0.16 45);
      --accent-ink: oklch(99% 0.01 60);
      --shadow: 0 1px 2px rgba(20,15,10,0.04), 0 8px 20px rgba(20,15,10,0.06);
    }
    *{box-sizing:border-box;}
    html,body{margin:0;height:100%;}
    body{background:var(--bg);color:var(--ink);font-family:'Work Sans', system-ui, sans-serif;}
  </style>
</helmet>
<div style="padding:48px;display:flex;flex-direction:column;gap:36px;">

  <div>
    <div style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-dark);margin-bottom:6px;">Variante A</div>
    <h2 style="margin:0;font-family:'Newsreader',Georgia,serif;font-size:22px;font-weight:600;">Navbar claire</h2>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px;">
    <div style="font-size:13px;color:var(--muted);">État déconnecté</div>
    <div style="display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 28px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="color:var(--accent);display:flex;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </span>
        <span style="font-family:'Newsreader',Georgia,serif;font-size:19px;font-weight:600;">Mon Blog</span>
      </div>
      <div style="display:flex;align-items:center;gap:24px;">
        <span style="font-size:14px;color:var(--muted);">Accueil</span>
        <button style="height:38px;padding:0 18px;border-radius:999px;border:1.5px solid var(--accent);background:transparent;color:var(--accent-dark);font-size:14px;font-weight:600;cursor:pointer;">Se connecter</button>
      </div>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:12px;">
    <div style="font-size:13px;color:var(--muted);">État connecté</div>
    <div style="display:flex;align-items:center;justify-content:space-between;height:64px;padding:0 28px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="color:var(--accent);display:flex;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </span>
        <span style="font-family:'Newsreader',Georgia,serif;font-size:19px;font-weight:600;">Mon Blog</span>
      </div>
      <div style="display:flex;align-items:center;gap:16px;">
        <span style="font-size:14px;color:var(--muted);">Accueil</span>
        <div style="width:1px;height:22px;background:var(--border);"></div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="width:30px;height:30px;border-radius:999px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;">AD</div>
          <span style="font-size:14px;color:var(--ink);">admin</span>
        </div>
        <button style="display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;font-weight:500;cursor:pointer;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Se déconnecter
        </button>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
