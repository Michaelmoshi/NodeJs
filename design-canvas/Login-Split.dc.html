<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap">
  <style>
    :root{
      --bg: oklch(97% 0.008 75);
      --surface: oklch(99% 0.003 75);
      --ink: oklch(20% 0.02 75);
      --muted: oklch(48% 0.015 75);
      --border: oklch(89% 0.01 75);
      --accent: oklch(62% 0.16 45);
      --accent-dark: oklch(52% 0.16 45);
      --accent-ink: oklch(99% 0.01 60);
      --danger-bg: oklch(96% 0.03 25);
      --danger-ink: oklch(45% 0.16 25);
      --danger-border: oklch(87% 0.06 25);
    }
    *{box-sizing:border-box;}
    html,body{margin:0;height:100%;}
    body{background:var(--surface);color:var(--ink);font-family:'Work Sans', system-ui, sans-serif;}
    input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  </style>
</helmet>
<div style="display:flex;min-height:100%;">

  <div style="flex:0 0 44%;background:var(--accent);color:var(--accent-ink);padding:56px;display:flex;flex-direction:column;justify-content:space-between;">
    <div style="display:flex;align-items:center;gap:10px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      <span style="font-family:'Newsreader',Georgia,serif;font-size:19px;font-weight:600;">Mon Blog</span>
    </div>
    <div style="font-family:'Newsreader',Georgia,serif;font-size:32px;line-height:1.35;font-weight:500;max-width:380px;">
      « Un espace pour écrire, partager, respirer. »
    </div>
    <div style="font-size:13px;opacity:0.85;">Espace de publication personnel</div>
  </div>

  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:56px;">
    <div style="width:100%;max-width:360px;display:flex;flex-direction:column;gap:22px;">

      <div>
        <h1 style="margin:0 0 6px;font-family:'Newsreader',Georgia,serif;font-size:26px;font-weight:600;">Bon retour</h1>
        <div style="font-size:14px;color:var(--muted);">Connecte-toi pour continuer</div>
      </div>

      <div style="display:flex;align-items:flex-start;gap:10px;background:var(--danger-bg);border:1px solid var(--danger-border);color:var(--danger-ink);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.4;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Identifiants invalides
      </div>

      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="font-size:13px;font-weight:500;">Nom d'utilisateur</label>
        <input type="text" placeholder="admin" style="height:44px;border-radius:10px;border:1px solid var(--border);padding:0 14px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--ink);" />
      </div>

      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="font-size:13px;font-weight:500;">Mot de passe</label>
        <input type="password" placeholder="••••••••" style="height:44px;border-radius:10px;border:1px solid var(--border);padding:0 14px;font-size:14px;font-family:inherit;background:var(--bg);color:var(--ink);" />
      </div>

      <button style="height:46px;border-radius:10px;border:none;background:var(--accent);color:var(--accent-ink);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:4px;">Se connecter</button>

      <div style="text-align:center;font-size:13px;color:var(--muted);">
        <span style="color:var(--accent-dark);font-weight:500;">← Retour à l'accueil</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
